<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    {{ partial "nav.html" . }}
    <button
      class="theme-toggle"
      type="button"
      id="theme-toggle"
      aria-live="polite"
      aria-label="Switch display mode">Display mode</button>
  </div>
</header>
<script>
  /* Display-mode toggle. No framework. */
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) { return; }
    var root = document.documentElement;

    function current() {
      var set = root.getAttribute("data-theme");
      if (set === "dark" || set === "light") { return set; }
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function label() {
      btn.textContent = current() === "dark" ? "Light mode" : "Dark mode";
    }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) { /* not fatal */ }
      label();
    });
    label();
  })();
</script>
