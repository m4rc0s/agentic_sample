{{ define "main" }}
<div class="wrap">
  <div class="layout__inner">
    <div class="prose">
      <h1>{{ .Title }}</h1>
      {{ with .Params.lead }}<p class="page-lead">{{ . }}</p>{{ end }}
      {{ .Content }}
      {{ with .Pages }}
      <ul class="entry-list">
        {{ range . }}
        <li>
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </li>
        {{ end }}
      </ul>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
